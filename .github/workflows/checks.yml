name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -B scripts/check_publication.py
      - run: python -B -m unittest discover -s tests -p 'test_*.py' -q
      - run: |
          $testFiles = Get-ChildItem tests -Filter '*.mjs' | ForEach-Object FullName
          node --test $testFiles
      - run: python -B scripts/init_library.py
      - run: python -B scripts/build.py --check
